# nginx access log'unu JSON olarak yazdırır.
# "Analytics - NGINX" dashboard'u "| json" parser'ı kullanıyor; nginx varsayılan
# "combined" formatında yazarsa dashboard TAMAMEN BOŞ gelir.
#
# Kurulum:
#   cp nginx/log-json.conf /etc/nginx/conf.d/log-json.conf
#   # http{} bloğundaki mevcut access_log satırını devre dışı bırak, sonra:
#   nginx -t && systemctl reload nginx
#
# ALAN ADLARINA DİKKAT — dashboard sorguları nginx değişken adını değil, buradaki
# JSON anahtarını arar. İkisi tutmazsa panel hata vermez, sessizce boş kalır.
#
#   "http_user_agent"  bot/crawler filtresi bunu arar   ("user_agent" yazarsan eler gibi
#                                                        yapar ama hiçbir şeyi elemez)
#   "http_referer"     Top Referrers panelleri bunu arar ("referer" yazarsan panel boş gelir)
#
# Kendi log formatını yazacaksan bu iki anahtarı aynen koru.

log_format log-json escape=json
    '{'
    '"time_local":"$time_local",'
    '"remote_addr":"$remote_addr",'
    '"status":"$status",'
    '"msec":"$msec",'
    '"bytes_sent":"$bytes_sent",'
    '"body_bytes_sent":"$body_bytes_sent",'
    '"request":"$request",'
    '"request_time":"$request_time",'
    '"request_method":"$request_method",'
    '"request_uri":"$request_uri",'
    '"request_length":"$request_length",'
    '"host":"$http_host",'
    '"http_referer":"$http_referer",'
    '"http_user_agent":"$http_user_agent",'
    '"x_forwarded_for":"$http_x_forwarded_for",'
    '"x_forwarded_proto":"$http_x_forwarded_proto",'
    '"connection":"$connection",'
    '"accept_encoding":"$http_accept_encoding",'
    '"accept_language":"$http_accept_language",'
    '"cf_ipcountry":"$http_cf_ipcountry"'
    '}';

access_log /var/log/nginx/access.log log-json;
