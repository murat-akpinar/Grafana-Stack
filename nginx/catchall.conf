# Tanımadığın Host başlığıyla gelen istekleri cevapsız kapatır (444).
#
# NEDEN: 80/443'te "default_server" yoksa nginx, portu dinleyen İLK server
# bloğunu varsayılan yapar. Genelde bu senin sitendir; o zaman IP'ne doğrudan
# gelen tarayıcılar ve DNS kaydı (yanlışlıkla ya da kasten) senin IP'ni
# gösteren yabancı domainler 200 alır — siten o domainin adıyla sunulur.
# Belirtisi: "Analytics - NGINX" dashboard'unun host listesinde tanımadığın
# domainler, IP adresleri, boş ya da Log4Shell payload'ı (${jndi:...}) içeren
# host değerleri.
#
# Kurulum:
#   cp nginx/catchall.conf /etc/nginx/conf.d/catchall.conf
#   # aşağıdaki sertifika yollarını kendi sertifikanla değiştir, sonra:
#   nginx -t && systemctl reload nginx
#
# "duplicate default server" hatası alırsan başka bir server bloğunda
# (Debian/Ubuntu'da genelde sites-enabled/default) zaten "default_server"
# vardır; onu oradan kaldır.
#
# SERTİFİKA: Host başlığı TLS el sıkışmasından SONRA okunur, bu yüzden 443
# bloğu bir sertifika sunmak zorunda. Mevcut certbot sertifikanı kullanman
# yeterli. nginx >= 1.19.4'te sertifika satırları yerine
# "ssl_reject_handshake on;" yazabilirsin; el sıkışma baştan reddedilir.
#
# fail2ban kullanıyorsan 444'ü "kötü istek" sayan bir filtre, bu istekleri
# yapan tarayıcıları otomatik banlar. Kendi IP'ni ignoreip'e eklemeyi unutma.
#
# Bu istekler log'a yine düşer (status 444). Hiç görmek istemiyorsan
# bloğa "access_log off;" ekle.

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    return 444;
}
