name: grafana

services:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      # Varsayilan olarak SADECE loopback. Grafana disariya
      # dogrudan acilmaz; onune reverse proxy koy ya da SSH tuneli kullan.
      # Dogrudan acmak istersen: "3000:3000" (o zaman TLS + kimlik dogrulama sart)
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - TZ=Europe/Istanbul
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - /usr/share/zoneinfo/Europe/Istanbul:/etc/localtime:ro
    networks: [monitoring]
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [monitoring]
    restart: always

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "127.0.0.1:9100:9100"
    command:
      - '--path.rootfs=/host'
      - '--collector.systemd'
      - '--collector.processes'
    pid: host
    volumes:
      - '/:/host:ro,rslave'
      - '/proc:/host/proc:ro'
      - '/sys:/host/sys:ro'
    networks: [monitoring]
    restart: always

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    ports:
      - "127.0.0.1:9115:9115"
    networks: [monitoring]
    restart: always

  loki:
    image: grafana/loki:3.5.1
    container_name: loki
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks: [monitoring]
    restart: always

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    ports:
      - "127.0.0.1:9080:9080"
    volumes:
      - /var/log/nginx:/var/log/nginx:ro
      # /var/log DIZIN olarak baglanir, tek dosya olarak degil: docker bind
      # mount inode'a baglanir, logrotate auth.log'u auth.log.1'e rename edip
      # yeni inode acinca container eski (olu) dosyada takili kalir ve ssh
      # loglari akmayi keser. Dizin mount'unda isim her acilista cozulur.
      - /var/log:/var/log/host:ro
      - ./promtail/promtail.yaml:/etc/promtail/config.yaml:ro
      - promtail-positions:/promtail
    command: -config.file=/etc/promtail/config.yaml
    networks: [monitoring]
    restart: always

networks:
  monitoring:
    # name + external BILEREK boyle. Ag compose tarafindan olusturulmaz,
    # onceden var olmasi beklenir:  docker network create monitoring
    #
    # Nedeni: aksi halde compose ag adini proje adiyla onekler
    # (ornegin grafana_monitoring) ve her yeniden olusturmada farkli bir
    # subnet atanabilir. Reverse proxy'de konteyner subnet'ine gore
    # yazilmis bir 'allow' kuralin varsa (ornegin blackbox-exporter'in
    # kendi Grafana'ni problamasi icin) o kural sessizce bozulur ve
    # uptime paneli Grafana'yi 'down' gostermeye baslar.
    name: monitoring
    external: true

volumes:
  grafana-data:
  prometheus-data:
  loki-data:
  promtail-positions:
